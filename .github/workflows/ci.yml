name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.1"

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Code generation (freezed / json / riverpod / drift)
        run: dart run build_runner build
      - run: flutter gen-l10n
      - name: Format (hand-written sources)
        run: |
          dart format --output=none --set-exit-if-changed \
            $(git ls-files 'lib/*.dart' 'test/*.dart' | grep -vE '\.(g|freezed)\.dart$|^lib/l10n/')
      - name: Analyze
        run: flutter analyze
      - name: Test (unit + widget + GPU shader pipeline)
        run: flutter test --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info

  android:
    name: Android APKs (split per ABI)
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v7
        with:
          name: lumora-android-apks
          path: build/app/outputs/flutter-apk/*.apk

  ios:
    name: iOS (no codesign)
    needs: analyze-test
    runs-on: macos-latest
    # Best-effort, like the release: third-party binary hosts must not turn
    # every pull request red.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Route ONNX Runtime SPM binaries around download.onnxruntime.ai
        run: bash tool/ios_fix_onnxruntime_spm.sh
      - run: flutter build ios --release --no-codesign
      - name: Package Runner.app
        run: cd build/ios/iphoneos && zip -qr Lumora-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v7
        with:
          name: lumora-ios-unsigned
          path: build/ios/iphoneos/Lumora-unsigned.zip
