name: Mirror models

# Publishes every registered model as an asset of the `models-1.3` release on
# this repository (identical bytes, verified against the pinned SHA-256), so
# model downloads never depend on a single third-party host. The app falls
# back to this release automatically when the primary URL fails.
#
# Run manually after adding or updating a model in the registry
# (Actions → Mirror models → Run workflow). Requires release permissions.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-models
  cancel-in-progress: false

jobs:
  mirror:
    name: Verify & upload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.1"
          cache: false

      - name: Registry URLs (single source of truth)
        run: dart run tool/mirror_models.dart > /tmp/model_urls.tsv

      - name: Download & verify every model
        run: python3 tool/mirror_models.py /tmp/model_urls.tsv --out /tmp/mirror

      - name: Upload to the models-1.3 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view models-1.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create models-1.3 \
                 --repo "$GITHUB_REPOSITORY" \
                 --title "Model mirror 1.3" \
                 --notes "Project-hosted copy of every on-device model (identical bytes, SHA-256 verified). The app uses it automatically when the primary download host fails."
          gh release upload models-1.3 /tmp/mirror/*.onnx --clobber --repo "$GITHUB_REPOSITORY"
          gh release view models-1.3 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
