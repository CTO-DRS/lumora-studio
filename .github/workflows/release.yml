name: Release

# Builds installable binaries and publishes them to a GitHub Release.
#  * push a tag like v1.1.0                → release "v1.1.0"
#  * run manually (Actions → Release → Run) → release for the tag you type,
#    or v<pubspec version> when left empty (the tag is created on this commit)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty = v<version from pubspec.yaml>)"
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.50.1"

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        shell: bash
        run: |
          version=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([^+]+).*/\1/')
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="v${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag} (pubspec ${version})"

  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Code generation
        run: dart run build_runner build
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APKs (split per ABI)
    needs: [meta, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # The official upload key lives in the private repo CTO-DRS/lumora-studio-private.
      # With the LUMORA_PRIVATE_TOKEN secret set, release APKs are signed with it;
      # without it they fall back to the debug key (forks, first-time setups).
      - name: Fetch release signing key (private repo)
        id: signing
        shell: bash
        env:
          TOKEN: ${{ secrets.LUMORA_PRIVATE_TOKEN }}
        run: |
          if [[ -z "$TOKEN" ]]; then
            echo "::warning::LUMORA_PRIVATE_TOKEN not set; APKs will be debug-signed."
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/CTO-DRS/lumora-studio-private.git" "$RUNNER_TEMP/lumora-private"
          cp "$RUNNER_TEMP/lumora-private/android/lumora-upload.p12" android/app/lumora-upload.p12
          cp "$RUNNER_TEMP/lumora-private/android/key.properties" android/key.properties
          cp "$RUNNER_TEMP/lumora-private/android/cert-sha256.txt" "$RUNNER_TEMP/cert-sha256.txt"
          rm -rf "$RUNNER_TEMP/lumora-private"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - run: flutter build apk --release --split-per-abi
      - name: Verify APK signature
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        run: |
          expected=$(grep -oE '([0-9A-F]{2}:){31}[0-9A-F]{2}' "$RUNNER_TEMP/cert-sha256.txt" | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            got=$("$apksigner" verify --print-certs "$f" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
            echo "$f -> $got"
            [[ "$got" == "$expected" ]] || { echo "::error::$f is not signed with the Lumora upload key"; exit 1; }
          done
      - name: Remove signing material
        if: always()
        run: rm -f android/app/lumora-upload.p12 android/key.properties
      - name: Name APKs after the release
        shell: bash
        run: |
          mkdir -p dist
          tag="${{ needs.meta.outputs.tag }}"
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/app-(.*)-release\.apk/\1/')
            cp "$f" "dist/Lumora-${tag}-${abi}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS-android.txt)
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error

  ios:
    name: iOS (unsigned)
    needs: [meta, test]
    runs-on: macos-latest
    # iOS is best-effort: a failure here must not block the Android release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # download.onnxruntime.ai serves an invalid TLS certificate; fetch the
      # onnxruntime-extensions archive SwiftPM insists on from Microsoft's
      # origin storage instead (same file, same checksum). See the script.
      - name: Route ONNX Runtime SPM binaries around download.onnxruntime.ai
        run: bash tool/ios_fix_onnxruntime_spm.sh
      - name: Build iOS (retries for flaky SPM binary downloads)
        shell: bash
        run: |
          for i in 1 2 3; do
            if flutter build ios --release --no-codesign; then exit 0; fi
            echo "iOS build attempt $i failed; retrying in 60s"
            rm -rf ~/Library/Caches/org.swift.swiftpm ~/Library/Developer/Xcode/DerivedData/*/SourcePackages || true
            sleep 60
          done
          exit 1
      - name: Package Runner.app
        run: |
          mkdir -p dist
          cd build/ios/iphoneos
          zip -qry "$GITHUB_WORKSPACE/dist/Lumora-${{ needs.meta.outputs.tag }}-ios-unsigned.zip" Runner.app
          cd "$GITHUB_WORKSPACE/dist" && shasum -a 256 *.zip > SHA256SUMS-ios.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-ios
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [meta, android, ios]
    if: ${{ always() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          version="${{ needs.meta.outputs.version }}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > notes.md || true
          if [[ ! -s notes.md ]]; then echo "See CHANGELOG.md" > notes.md; fi
          {
            echo
            echo "### Downloads"
            echo "* **Android**: most phones need \`arm64-v8a\`; older 32-bit phones \`armeabi-v7a\`; emulators \`x86_64\`."
            echo "* **iOS**: unsigned \`Runner.app\` (sign it yourself, e.g. with AltStore/Sideloadly or Xcode)."
            echo "* Checksums: \`SHA256SUMS-*.txt\`."
          } >> notes.md
          ls -la dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Lumora Studio ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease == true }}
          fail_on_unmatched_files: false
          files: |
            dist/*.apk
            dist/*.zip
            dist/SHA256SUMS-*.txt
