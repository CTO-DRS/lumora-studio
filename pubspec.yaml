name: lumora
description: "Lumora Studio – a 100% on-device, open-source AI photo & video editor."
publish_to: 'none'
version: 1.3.2+7

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

# Versions verified against pub.dev on 2026-11-20 (see docs/DEPENDENCIES.md).
dependencies:
  collection: ^1.19.1
  crypto: ^3.0.8
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  ffmpeg_kit_flutter_new_min_gpl: ^2.7.2
  file_picker: ^13.4.0
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_localizations:
    sdk: flutter
  flutter_onnxruntime: ^1.9.0
  flutter_riverpod: ^3.5.0
  freezed_annotation: ^3.1.0
  gal: ^3.0.1
  go_router: ^18.1.4
  http: ^1.6.0
  image: ^4.13.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  material_ui: ^1.11.1
  native_exif: ^0.8.0
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.8
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  video_player: ^2.14.1

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  riverpod_generator: ^4.0.10
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  shaders:
    - shaders/develop.frag
    - shaders/detail.frag
    - shaders/effects.frag
    - shaders/blur.frag
    - shaders/mask_blend.frag
    - shaders/warp.frag
    - shaders/video_filter.frag
    - shaders/clipping.frag
  assets:
    - assets/luts/
    - assets/branding/
